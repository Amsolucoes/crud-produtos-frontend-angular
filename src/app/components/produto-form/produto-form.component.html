<div class="container">
  <h2>{{ modoEdicao ? 'Editar Produto' : 'Novo Produto' }}</h2>

  <form [formGroup]="form" (ngSubmit)="salvar()">
    <div class="campo">
      <label>Nome</label>
      <input type="text" formControlName="nome" />
      <span class="erro" *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">
        Nome é obrigatório
      </span>
    </div>

    <div class="campo">
      <label>Descrição</label>
      <textarea formControlName="descricao"></textarea>
    </div>

    <div class="campo">
      <label>Preço</label>
      <input type="number" step="0.01" formControlName="preco" />
    </div>

    <div class="campo">
      <label>Quantidade em Estoque</label>
      <input type="number" formControlName="quantidade_estoque" />
    </div>

    <div class="acoes">
      <button type="submit" [disabled]="form.invalid">Salvar</button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
